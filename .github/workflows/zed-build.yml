name: Build Zed Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Zed code
        uses: actions/checkout@v3

      - name: Show system info
        run: systeminfo

      - name: Install Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Install Visual Studio Build Tools (choco → winget fallback)
        run: |
          try {
            choco install -y visualstudio2022buildtools visualstudio2022-workload-vctools
          } catch {
            Write-Warning "⚠️ Chocolatey failed, trying winget..."
            winget install --id Microsoft.VisualStudio.2022.BuildTools --accept-package-agreements --accept-source-agreements --silent
          }

      - name: Cache Cargo registry and target
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Zed
        run: |
          cargo build --release --verbose

      - name: List build outputs
        run: Get-ChildItem -Recurse -Path target\release

      - name: Check if zed.exe was built
        run: |
          if (!(Test-Path target\release\zed.exe)) {
            Write-Error "❌ Build failed: zed.exe not found"
            exit 1
          }

      - name: Upload zed.exe as artifact
        uses: actions/upload-artifact@v3
        with:
          name: zed-exe
          path: target/release/zed.exe
