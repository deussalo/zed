name: Build Zed Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Zed code
        uses: actions/checkout@v3

      - name: Install Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Install Build Tools
        run: |
          choco install -y visualstudio2022buildtools visualstudio2022-workload-vctools

      - name: Build Zed
        run: cargo build --release --verbose

      - name: Verify Build Output
        run: |
          if not exist target\release\zed.exe (
            echo "Build failed: zed.exe not found" >&2
            exit 1
          )

      - name: Upload executable
        uses: actions/upload-artifact@v3
        with:
          name: zed-exe
          path: target/release/zed.exe
