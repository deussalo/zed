name: Build Zed Windows Executable

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Zed code
        uses: actions/checkout@v3

      - name: Move repo to C:\src to prevent long paths
        run: |
          New-Item -ItemType Directory -Force -Path C:\src
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\*" C:\src
          Set-Location C:\src

      - name: Enable long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Install Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Install Visual Studio Build Tools (silent installer)
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vs_BuildTools.exe -OutFile vs_BuildTools.exe
          Start-Process -Wait -FilePath .\vs_BuildTools.exe -ArgumentList `
            "--quiet", `
            "--wait", `
            "--norestart", `
            "--nocache", `
            "--installPath", "C:\BuildTools", `
            "--add", "Microsoft.VisualStudio.Workload.VCTools", `
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", `
            "--includeRecommended", `
            "--includeOptional", `
            "--acceptLicense"

      - name: Cache Cargo registry and target
        uses: actions/cache@v3
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            C:\src\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Zed
        working-directory: C:\src
        run: |
          cargo build --release --verbose

      - name: List build outputs
        run: Get-ChildItem -Recurse -Path C:\src\target\release

      - name: Check if zed.exe was built
        run: |
          if (!(Test-Path C:\src\target\release\zed.exe)) {
            Write-Error "❌ Build failed: zed.exe not found"
            exit 1
          }

      - name: Upload zed.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-exe
          path: C:\src\target\release\zed.exe
